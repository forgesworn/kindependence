<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kindependence — a campfire: flame over two crossed sticks">
  <!-- Kindependence mark: the Kindred suite's DNA flame over two crossed
       sticks — base camp and signal fire (the Kindred brand book's campfire
       mark), composed as an app icon the suite's usual way: carrier + flame
       on warm dark ink, flame in gold, carrier in paper. -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <!-- warm dark ink ground -->
    <rect width="512" height="512" fill="#241b12"/>
    <!-- the campfire, centred (mark's own centering transform kept verbatim
         from the brand source, then scaled 48-grid -> 512) -->
    <g transform="translate(256,256) scale(8) translate(-24,-24)">
      <g transform="translate(-1.895,-7.599) scale(1.0789)">
        <path fill="none" stroke="#f9f8f4" stroke-width="4" stroke-linecap="round" d="M7 42.5L41 35.5"/>
        <path fill="none" stroke="#f9f8f4" stroke-width="4" stroke-linecap="round" d="M7 35.5L41 42.5"/>
        <g transform="translate(24,23) scale(0.68) translate(-24,-17.75)">
          <path fill="#e0a458" fill-rule="evenodd" d="M24 6c5 6.5 8 10.5 8 15.5a8 8 0 0 1-16 0C16 16.5 19 12.5 24 6Z M24 13c2.8 3.7 4.5 5.9 4.5 8.7a4.5 4.5 0 0 1-9 0c0-2.8 1.7-5.1 4.5-8.7Z"/>
        </g>
      </g>
    </g>
  </g>
</svg>
